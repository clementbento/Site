<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🧠 Quiz du Bureau</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(135deg,#f1f5ff 0%,#fdf4ff 100%);min-height:100vh}

  /* ── header ── */
  #header{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:white;padding:16px 20px;text-align:center;box-shadow:0 4px 20px #4f46e540}
  #header h1{font-size:1.4rem;font-weight:900;letter-spacing:-.5px}
  #header p{font-size:.75rem;color:#c7d2fe;margin-top:3px}

  /* ── tabs ── */
  #tabs{display:flex;background:white;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px #0000000d}
  .tab-btn{flex:1;padding:12px 4px;font-size:.72rem;font-weight:700;border:none;border-bottom:2.5px solid transparent;background:white;cursor:pointer;color:#94a3b8;transition:all .15s}
  .tab-btn.active{color:#4f46e5;border-bottom-color:#6366f1;background:#f5f3ff}

  /* ── panels ── */
  #app{max-width:560px;margin:0 auto;padding:16px 12px 40px}
  .panel{display:none}.panel.active{display:block}
  .section-title{text-align:center;font-size:.68rem;font-weight:700;color:#94a3b8;letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px;margin-top:4px}

  /* ── panel 1 ── */
  .player-row{display:flex;align-items:center;gap:10px;border-radius:16px;padding:12px 14px;margin-bottom:8px;border:1px solid #e2e8f0;background:white;transition:all .2s;box-shadow:0 1px 4px #0000000a}
  .player-row.locked{background:#f0fdf4;border-color:#bbf7d0}
  .avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:white;font-size:.9rem;flex-shrink:0}
  .player-name{flex:1;font-weight:700;font-size:.88rem;color:#1e293b}
  .player-row.locked .player-name{color:#16a34a}
  .score-display{display:flex;align-items:center;gap:6px}
  .score-val{font-size:1.2rem;font-weight:900}
  .score-ok{font-size:.7rem;color:#16a34a;font-weight:600}
  .score-input{width:76px;border:2px solid #e2e8f0;border-radius:10px;padding:6px 8px;text-align:center;font-size:.88rem;font-weight:700;outline:none;transition:border-color .15s}
  .score-input:focus{border-color:#6366f1}
  .validate-btn{width:34px;height:34px;border-radius:10px;border:none;color:white;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:900;transition:transform .1s,opacity .2s;flex-shrink:0}
  .validate-btn:disabled{background:#e2e8f0!important;color:#94a3b8;cursor:default}
  .validate-btn:active:not(:disabled){transform:scale(.88)}
  .hint{text-align:center;font-size:.7rem;color:#cbd5e1;margin-top:12px}

  /* ── panel 2 – podium ── */
  #podium-wrap{display:flex;align-items:flex-end;justify-content:center;gap:8px;height:200px;background:white;border-radius:20px;padding:12px 8px 0;margin-bottom:14px;box-shadow:0 2px 8px #0000000d;border:1px solid #f1f5f9}
  .podium-col{flex:1;display:flex;flex-direction:column;align-items:center}
  .podium-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:white;font-size:1rem;margin-bottom:4px;box-shadow:0 4px 12px #0000002a}
  .podium-avatar.first{width:46px;height:46px;font-size:1.1rem}
  .podium-pname{font-size:.68rem;font-weight:700;color:#475569;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
  .podium-pts{font-size:.72rem;font-weight:900;margin-bottom:4px}
  .podium-block{width:100%;border-radius:8px 8px 0 0;display:flex;align-items:center;justify-content:center;font-size:1.3rem;box-shadow:inset 0 2px 6px #00000020}
  .crown{font-size:1.3rem;margin-bottom:2px;animation:bounce 1s infinite alternate}
  @keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-4px)}}

  /* ranking list */
  .rank-list{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
  .rank-row{display:flex;align-items:center;gap:10px;background:white;border-radius:12px;padding:9px 12px;box-shadow:0 1px 4px #0000000a;border:1px solid #f1f5f9}
  .rank-pos{width:28px;text-align:center;font-weight:900;font-size:.85rem;color:#94a3b8}
  .rank-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .rank-name{flex:1;font-size:.85rem;font-weight:600;color:#334155}
  .rank-total{font-size:.85rem;font-weight:900}

  /* chart */
  #chart-box{background:white;border-radius:20px;padding:14px;box-shadow:0 2px 8px #0000000d;border:1px solid #f1f5f9}
  #chart-box h3{font-size:.68rem;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
  #chart-empty{text-align:center;padding:30px;color:#cbd5e1;font-size:.85rem}

  /* ── panel 3 ── */
  .admin-bar{display:flex;align-items:center;gap:10px;background:white;border-radius:16px;padding:12px 14px;margin-bottom:12px;box-shadow:0 1px 4px #0000000a;border:1px solid #f1f5f9}
  .admin-bar label{font-size:.72rem;font-weight:700;color:#64748b;white-space:nowrap}
  #code-input{width:70px;border:2px solid #e2e8f0;border-radius:10px;padding:5px 8px;text-align:center;font-size:.9rem;font-weight:700;outline:none;transition:all .2s;letter-spacing:.1em}
  #code-input.ok{border-color:#22c55e;background:#f0fdf4}
  #admin-status{font-size:.72rem;font-weight:700}
  #admin-status.ok{color:#16a34a}
  #admin-status.err{color:#f87171}

  #names-editor{background:#fffbeb;border:2px solid #fcd34d;border-radius:16px;padding:14px;margin-bottom:12px;display:none}
  #names-editor h4{font-size:.72rem;font-weight:900;color:#92400e;margin-bottom:10px}
  .names-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
  .name-field{display:flex;align-items:center;gap:6px}
  .name-bar{width:4px;height:32px;border-radius:3px;flex-shrink:0}
  .name-input{flex:1;border:1px solid #fcd34d;border-radius:8px;padding:5px 8px;font-size:.78rem;font-weight:600;outline:none}
  .name-input:focus{border-color:#f59e0b}
  #save-names-btn{background:linear-gradient(135deg,#f59e0b,#d97706);color:white;border:none;border-radius:10px;padding:7px 16px;font-size:.75rem;font-weight:900;cursor:pointer}
  #edit-hint{text-align:center;font-size:.72rem;color:#6366f1;font-weight:600;margin-bottom:8px;display:none}

  /* table */
  .table-wrap{border-radius:16px;overflow:hidden;border:1px solid #e2e8f0;box-shadow:0 2px 8px #0000000d;overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:.72rem;background:white;min-width:420px}
  thead tr{background:linear-gradient(135deg,#4f46e5,#7c3aed)}
  th{padding:9px 6px;color:white;font-weight:700;text-align:center;white-space:nowrap}
  th:first-child{text-align:left;padding-left:10px;position:sticky;left:0;background:#4f46e5}
  td{padding:6px 6px;text-align:center;font-weight:600;border-top:1px solid #f1f5f9;transition:background .1s}
  td:first-child{text-align:left;padding-left:10px;font-weight:600;color:#64748b;white-space:nowrap;position:sticky;left:0}
  tr.future{opacity:.35}
  tr.today td:first-child{border-left:3px solid #6366f1;color:#4f46e5;font-weight:900;background:#f5f3ff!important}
  tr.alt td:first-child{background:#f9fafb}
  tr.alt td{background:#f9fafb}
  tr.today td{background:#f5f3ff}
  td.editable:hover{background:#eef2ff!important;cursor:pointer}
  .cell-edit{width:50px;border:2px solid #6366f1;border-radius:6px;padding:2px 4px;text-align:center;font-size:.72rem;font-weight:700;outline:none}
  tfoot tr{background:linear-gradient(135deg,#4f46e5,#7c3aed)}
  tfoot td{padding:8px 6px;color:white;font-weight:900;border-top:2px solid #312e81}
  tfoot td:first-child{background:#4f46e5;position:sticky;left:0}
</style>
</head>
<body>

<div id="header">
  <h1>🧠 Quiz du Bureau</h1>
  <p id="date-display"></p>
</div>

<div id="tabs">
  <button class="tab-btn active" onclick="switchTab(0)">📝 Scores du jour</button>
  <button class="tab-btn" onclick="switchTab(1)">🏆 Classement</button>
  <button class="tab-btn" onclick="switchTab(2)">🗂️ Base de données</button>
</div>

<div id="app">

  <!-- PANEL 1 -->
  <div class="panel active" id="panel-0">
    <p class="section-title" id="p1-title">Saisie du jour</p>
    <div id="players-list"></div>
    <p class="hint">Score verrouillé après validation · Modifiable via Base de données</p>
  </div>

  <!-- PANEL 2 -->
  <div class="panel" id="panel-1">
    <p class="section-title">Classement du mois</p>
    <div id="podium-wrap"></div>
    <div id="rank-list" class="rank-list"></div>
    <div id="chart-box">
      <h3>Scores cumulés sur le mois</h3>
      <div id="chart-empty" style="display:none">📊 Aucun score encore enregistré</div>
      <canvas id="myChart" height="180"></canvas>
    </div>
  </div>

  <!-- PANEL 3 -->
  <div class="panel" id="panel-2">
    <p class="section-title">Base de données</p>
    <div class="admin-bar">
      <label>Code admin :</label>
      <input type="password" id="code-input" maxlength="4" placeholder="••••" oninput="checkCode(this.value)"/>
      <span id="admin-status"></span>
    </div>
    <div id="names-editor">
      <h4>✏️ Modifier les noms des joueurs</h4>
      <div class="names-grid" id="names-grid"></div>
      <button id="save-names-btn" onclick="saveNames()">Sauvegarder les noms</button>
    </div>
    <p id="edit-hint">Cliquez sur une cellule pour modifier sa valeur</p>
    <div class="table-wrap">
      <table id="db-table">
        <thead id="db-head"></thead>
        <tbody id="db-body"></tbody>
        <tfoot id="db-foot"></tfoot>
      </table>
    </div>
  </div>

</div>

<script>
// ─── constants ───────────────────────────────────────────
const N = 8;
const DEFAULT_NAMES = ["Clément","Alex","Thibault","Halim","Grégoire","Lilian","Nazih","Léo"];
const COLORS = ["#6366f1","#f59e0b","#10b981","#ef4444","#8b5cf6","#ec4899","#0ea5e9","#f97316"];
const MEDAL  = ["🥇","🥈","🥉"];
const FR_DAYS = ["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];

// ─── state ───────────────────────────────────────────────
let names    = [...DEFAULT_NAMES];
let scores   = {};       // { "2026-07-01": { 0:5, 1:3, … } }
let validated = {};      // { 0: true } – locked today

let adminUnlocked = false;
let editCell = null;     // { date, idx }
let chartInst = null;
let currentTab = 0;

// ─── date helpers ────────────────────────────────────────
function toISO(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const dd = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${dd}`;
}
function dispDate(s) { const [,m,d]=s.split("-"); return `${d}/${m}`; }
function dayLabel(s) {
  const [y,m,d]=s.split("-").map(Number);
  return FR_DAYS[new Date(y,m-1,d).getDay()];
}
function getWorkingDays(year,month) {
  const days=[], d=new Date(year,month,1);
  while(d.getMonth()===month){
    if(d.getDay()>=1&&d.getDay()<=5) days.push(toISO(d));
    d.setDate(d.getDate()+1);
  }
  return days;
}

const now   = new Date();
const TODAY = toISO(now);
const YEAR  = now.getFullYear();
const MONTH = now.getMonth();
const WORKING_DAYS = getWorkingDays(YEAR, MONTH);

// ─── persist ─────────────────────────────────────────────
function persist() {
  localStorage.setItem("quiz_main", JSON.stringify({ names, scores }));
}
function persistValidated() {
  localStorage.setItem("quiz_val_"+TODAY, JSON.stringify(validated));
}
function load() {
  try {
    const raw = localStorage.getItem("quiz_main");
    if (raw) { const d=JSON.parse(raw); if(d.names) names=d.names; if(d.scores) scores=d.scores; }
  } catch {}
  try {
    const raw = localStorage.getItem("quiz_val_"+TODAY);
    if (raw) validated = JSON.parse(raw);
  } catch {}
}

// ─── derived ─────────────────────────────────────────────
function getTotals() {
  const totals = Array(N).fill(0);
  const past = WORKING_DAYS.filter(d=>d<=TODAY);
  for (const d of past) {
    const ds = scores[d]||{};
    for (let i=0;i<N;i++) totals[i]+=(ds[i]??0);
  }
  return totals;
}
function getRanking() {
  const totals=getTotals();
  return Array.from({length:N},(_,i)=>({name:names[i],idx:i,total:totals[i]}))
    .sort((a,b)=>b.total-a.total);
}
function getCumData() {
  const data=[], run=Array(N).fill(0);
  const past=WORKING_DAYS.filter(d=>d<=TODAY);
  for (const d of past) {
    const ds=scores[d]||{};
    for(let i=0;i<N;i++) run[i]+=(ds[i]??0);
    data.push({ date:dispDate(d), vals:[...run] });
  }
  return data;
}

// ─── panel 1 ─────────────────────────────────────────────
function renderPanel1() {
  document.getElementById("p1-title").textContent =
    `Saisie du ${dispDate(TODAY)} — ${dayLabel(TODAY)}`;
  const todayScores = scores[TODAY]||{};
  const list = document.getElementById("players-list");
  list.innerHTML = "";
  for (let i=0;i<N;i++) {
    const locked = validated[i]!==undefined || todayScores[i]!==undefined;
    const score  = todayScores[i];
    const row = document.createElement("div");
    row.className = "player-row" + (locked?" locked":"");
    row.innerHTML = `
      <div class="avatar" style="background:${COLORS[i]}">${names[i][0]?.toUpperCase()}</div>
      <span class="player-name">${names[i]}</span>
      <div class="score-display" id="sd-${i}">
        ${locked
          ? `<span class="score-val" style="color:${COLORS[i]}">${score}</span>
             <span class="score-ok">pts ✓</span>`
          : `<input class="score-input" id="inp-${i}" type="number" min="0" placeholder="Score"
               style="border-color:#e2e8f0;color:${COLORS[i]}"
               oninput="onInputChange(${i})" onkeydown="if(event.key==='Enter')doValidate(${i})"/>
             <button class="validate-btn" id="btn-${i}" style="background:${COLORS[i]}" disabled onclick="doValidate(${i})">✓</button>`
        }
      </div>`;
    list.appendChild(row);
  }
}
function onInputChange(i) {
  const inp = document.getElementById("inp-"+i);
  const btn = document.getElementById("btn-"+i);
  const v = inp.value.trim();
  btn.disabled = v==="";
  inp.style.borderColor = v ? COLORS[i] : "#e2e8f0";
}
function doValidate(i) {
  const inp = document.getElementById("inp-"+i);
  const v = parseInt(inp.value);
  if (isNaN(v)||v<0) return;
  if (!scores[TODAY]) scores[TODAY]={};
  scores[TODAY][i]=v;
  validated[i]=true;
  persist(); persistValidated();
  renderPanel1();
}

// ─── panel 2 ─────────────────────────────────────────────
function renderPanel2() {
  renderPodium();
  renderRankList();
  renderChart();
}

function renderPodium() {
  const ranking = getRanking();
  // Order: 2nd | 1st | 3rd
  const order = [ranking[1], ranking[0], ranking[2]];
  const heights = [80, 118, 58];
  const bgColors = ["#cbd5e1","#facc15","#d97706"];
  const wrap = document.getElementById("podium-wrap");
  wrap.innerHTML = "";
  order.forEach((r,pos) => {
    const rank = pos===1?0:pos===0?1:2; // actual rank
    const col = document.createElement("div");
    col.className = "podium-col";
    const crown = rank===0 ? `<div class="crown">👑</div>` : "";
    col.innerHTML = `
      ${crown}
      <div class="podium-avatar${rank===0?' first':''}" style="background:${COLORS[r.idx]};box-shadow:0 4px 12px ${COLORS[r.idx]}55">
        ${r.name[0]?.toUpperCase()}
      </div>
      <div class="podium-pname">${r.name}</div>
      <div class="podium-pts" style="color:${COLORS[r.idx]}">${r.total} pts</div>
      <div class="podium-block" style="height:${heights[pos]}px;background:${bgColors[pos]}">${MEDAL[rank]}</div>`;
    wrap.appendChild(col);
  });
}

function renderRankList() {
  const ranking = getRanking();
  const list = document.getElementById("rank-list");
  list.innerHTML = "";
  ranking.forEach((r,pos) => {
    const row = document.createElement("div");
    row.className="rank-row";
    row.innerHTML=`
      <span class="rank-pos" style="color:${pos<3?'#4f46e5':'#94a3b8'}">${pos<3?MEDAL[pos]:`${pos+1}.`}</span>
      <div class="rank-dot" style="background:${COLORS[r.idx]}"></div>
      <span class="rank-name">${r.name}</span>
      <span class="rank-total" style="color:${COLORS[r.idx]}">${r.total} pts</span>`;
    list.appendChild(row);
  });
}

function renderChart() {
  const data = getCumData();
  const chartEl = document.getElementById("myChart");
  const emptyEl = document.getElementById("chart-empty");
  if (data.length===0) {
    chartEl.style.display="none"; emptyEl.style.display="block"; return;
  }
  chartEl.style.display="block"; emptyEl.style.display="none";
  if (chartInst) chartInst.destroy();
  chartInst = new Chart(chartEl, {
    type:"line",
    data:{
      labels: data.map(d=>d.date),
      datasets: Array.from({length:N},(_,i)=>({
        label: names[i],
        data: data.map(d=>d.vals[i]),
        borderColor: COLORS[i],
        backgroundColor: "transparent",
        borderWidth: 2.5,
        pointRadius: 0,
        tension: .3
      }))
    },
    options:{
      responsive:true,
      plugins:{
        legend:{ labels:{ font:{size:9}, boxWidth:12, padding:8 } },
        tooltip:{ mode:"index", intersect:false,
          callbacks:{ label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y} pts` } }
      },
      scales:{
        x:{ ticks:{font:{size:9}}, grid:{color:"#f1f5f9"} },
        y:{ ticks:{font:{size:9}}, grid:{color:"#f1f5f9"} }
      }
    }
  });
}

// ─── panel 3 ─────────────────────────────────────────────
function renderPanel3() {
  renderDbHead();
  renderDbBody();
  renderNamesEditor();
}

function renderDbHead() {
  const head = document.getElementById("db-head");
  const shortName = n => n.length>6 ? n.slice(0,5)+"…" : n;
  head.innerHTML=`<tr>
    <th style="text-align:left">Jour</th>
    ${names.map((n,i)=>`<th title="${n}" style="color:#c7d2fe">${shortName(n)}</th>`).join("")}
    <th>Σ</th>
  </tr>`;
}

function renderDbBody() {
  const totals = Array(N).fill(0);
  const body = document.getElementById("db-body");
  body.innerHTML="";
  const past = WORKING_DAYS.filter(d=>d<=TODAY);
  // accumulate totals
  for (const d of past) { const ds=scores[d]||{}; for(let i=0;i<N;i++) totals[i]+=(ds[i]??0); }
  // rows
  WORKING_DAYS.forEach((day,di)=>{
    const ds = scores[day]||{};
    const isFuture = day>TODAY, isToday=day===TODAY;
    const hasData = Object.keys(ds).length>0;
    const rowTotal = Array.from({length:N},(_,i)=>ds[i]??0).reduce((a,b)=>a+b,0);
    const tr=document.createElement("tr");
    if(isFuture) tr.className="future";
    else if(isToday) tr.className="today";
    else if(di%2===0) tr.className="alt";
    // day cell
    const dayTd=document.createElement("td");
    dayTd.innerHTML=`<span style="color:#94a3b8;font-size:.68rem;margin-right:4px">${dayLabel(day)}</span>${dispDate(day)}`;
    tr.appendChild(dayTd);
    // score cells
    for(let i=0;i<N;i++){
      const td=document.createElement("td");
      if(adminUnlocked&&!isFuture) td.className="editable";
      const val=ds[i];
      if(editCell&&editCell.date===day&&editCell.idx===i){
        const inp=document.createElement("input");
        inp.className="cell-edit"; inp.type="number";
        inp.value=val!==undefined?val:"";
        inp.style.color=COLORS[i];
        inp.addEventListener("blur",()=>commitEdit());
        inp.addEventListener("keydown",e=>{ if(e.key==="Enter") commitEdit(); });
        setTimeout(()=>inp.focus(),10);
        td.appendChild(inp);
      } else {
        td.textContent=val!==undefined?val:"—";
        td.style.color=val!==undefined?COLORS[i]:"#cbd5e1";
        if(adminUnlocked&&!isFuture) td.onclick=()=>startEdit(day,i);
      }
      tr.appendChild(td);
    }
    // total cell
    const totTd=document.createElement("td");
    totTd.textContent=hasData?rowTotal:"—";
    totTd.style.color="#475569";
    tr.appendChild(totTd);
    body.appendChild(tr);
  });
  // footer totals
  const foot=document.getElementById("db-foot");
  foot.innerHTML=`<tr>
    <td style="text-align:left">TOTAL</td>
    ${totals.map(t=>`<td>${t}</td>`).join("")}
    <td>${totals.reduce((a,b)=>a+b,0)}</td>
  </tr>`;
}

function renderNamesEditor() {
  const ed=document.getElementById("names-editor");
  const hint=document.getElementById("edit-hint");
  ed.style.display=adminUnlocked?"block":"none";
  hint.style.display=adminUnlocked?"block":"none";
  if(!adminUnlocked) return;
  const grid=document.getElementById("names-grid");
  grid.innerHTML="";
  names.forEach((n,i)=>{
    const div=document.createElement("div");
    div.className="name-field";
    div.innerHTML=`<div class="name-bar" style="background:${COLORS[i]}"></div>
      <input class="name-input" id="ne-${i}" value="${n}" type="text"/>`;
    grid.appendChild(div);
  });
}

function checkCode(v) {
  const inp=document.getElementById("code-input");
  const st=document.getElementById("admin-status");
  adminUnlocked=(v==="2222");
  inp.className=adminUnlocked?"ok":"";
  if(adminUnlocked){ st.className="ok"; st.textContent="🔓 Édition activée"; }
  else if(v.length>0){ st.className="err"; st.textContent="Code incorrect"; }
  else { st.textContent=""; }
  renderNamesEditor();
  renderDbBody();
}

function saveNames() {
  for(let i=0;i<N;i++){
    const inp=document.getElementById("ne-"+i);
    if(inp) names[i]=inp.value||names[i];
  }
  persist();
  renderPanel1(); renderPanel2(); renderPanel3();
}

function startEdit(date,idx) {
  editCell={date,idx};
  renderDbBody();
}
function commitEdit() {
  if(!editCell) return;
  const {date,idx}=editCell;
  const inp=document.querySelector(".cell-edit");
  if(!inp){ editCell=null; return; }
  const v=parseInt(inp.value);
  if(!scores[date]) scores[date]={};
  if(isNaN(v)||inp.value.trim()==="") delete scores[date][idx];
  else scores[date][idx]=v;
  editCell=null;
  persist();
  renderDbBody();
  if(currentTab===1) renderPanel2();
}

// ─── tabs ─────────────────────────────────────────────────
function switchTab(i) {
  currentTab=i;
  document.querySelectorAll(".tab-btn").forEach((b,j)=>b.classList.toggle("active",i===j));
  document.querySelectorAll(".panel").forEach((p,j)=>p.classList.toggle("active",i===j));
  if(i===0) renderPanel1();
  if(i===1) renderPanel2();
  if(i===2) renderPanel3();
}

// ─── init ────────────────────────────────────────────────
document.getElementById("date-display").textContent =
  now.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});

load();
renderPanel1();
</script>
</body>
</html>
