<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Compteur Crochet</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3efe9;
            text-align: center;
            padding: 40px;
            transition: background-color 0.4s;
        }

        @keyframes shake {
            0% { transform: translate(0, 0); }
            25% { transform: translate(5px, -5px); }
            50% { transform: translate(-5px, 5px); }
            75% { transform: translate(5px, 5px); }
            100% { transform: translate(0, 0); }
        }

        .shake { animation: shake 0.4s ease; }

        h1 { color: #a86d3b; }

        #projectName {
            font-size: 22px;
            margin-top: -10px;
            margin-bottom: 20px;
            color: #6d4c41;
            font-weight: bold;
        }

        .counter {
            font-size: 80px;
            margin: 20px;
            color: #4e342e;
            transition: 0.2s;
        }

        .last-update {
            font-size: 12px;
            color: #555;
            margin-top: -10px;
            margin-bottom: 20px;
        }

        button, select {
            font-size: 20px;
            padding: 12px 20px;
            margin: 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        select {
            background: #fff;
            border: 2px solid #ce93d8;
        }

        .add { background: #8bc34a; }
        .minus { background: #e57373; }
        .reset { background: #bdbdbd; }
        .custom { background: #64b5f6; }
        .save { background: #ffb74d; }
        .load { background: #ce93d8; }
        .delete { background: #ef5350; color: white; }
    </style>
</head>
<body>

    <h1>Compteur de Crochet 🧶</h1>

    <div id="projectName">Aucun projet chargé</div>

    <div class="counter" id="counter">0</div>
    <div class="last-update" id="lastUpdate">Dernière actualisation il y a 0 seconde</div>

    <button class="add" onclick="increment()">+1 rang</button>
    <button class="minus" onclick="decrement()">−1</button>
    <button class="custom" onclick="addCustomValue()">+ valeur précise</button>
    <button class="reset" onclick="resetCount()">Réinitialiser</button>

    <br><br>

    <select id="projectSelect">
        <option value="">-- Sélectionnez un projet --</option>
    </select>

    <button class="load" onclick="loadSelectedProject()">📂 Charger</button>
    <button class="save" onclick="saveProject()">💾 Sauvegarder</button>
    <button class="delete" onclick="deleteProject()">🗑 Supprimer</button>

    <br><br>

    <a href="index.html" style="font-size:18px;">⬅ Retour</a>

    <audio id="ding">
        <source src="https://actions.google.com/sounds/v1/alarms/digital_watch_alarm.ogg" type="audio/ogg">
    </audio>

    <script>
        let count = 0;
        let lastUpdateTime = Date.now();
        let currentProject = null;

        const counterDisplay = document.getElementById("counter");
        const lastUpdateText = document.getElementById("lastUpdate");
        const projectNameDisplay = document.getElementById("projectName");
        const projectSelect = document.getElementById("projectSelect");
        const ding = document.getElementById("ding");
        const body = document.body;

        /* ------------ Mise à jour affichage ------------- */

        function refreshLastUpdate() {
            let totalSeconds = Math.floor((Date.now() - lastUpdateTime) / 1000);
            let minutes = Math.floor(totalSeconds / 60);
            let seconds = totalSeconds % 60;

            let text = "Dernière actualisation il y a ";
            if (minutes > 0) text += minutes + " min ";
            text += seconds + " s";

            lastUpdateText.textContent = text;
        }

        setInterval(refreshLastUpdate, 1000);

        function update() {
            counterDisplay.textContent = (count % 100 === 69) ? count + " 😈" : count;

            lastUpdateTime = Date.now();
            refreshLastUpdate();

            localStorage.setItem("compteurCrochet", count);

            body.classList.remove("shake");

            if (count > 0 && count % 8 === 7) {
                ding.currentTime = 0;
                ding.play().catch(() => {});
                if (navigator.vibrate) navigator.vibrate([150, 50, 150]);
                body.classList.add("shake");
                body.style.backgroundColor = "#ffcdd2"; 
            } else {
                body.style.backgroundColor = "#f3efe9";
            }
        }

        /* ------------ Boutons compteur ------------- */

        function increment() { count++; update(); }
        function decrement() { if (count > 0) count--; update(); }
        function resetCount() { count = 0; update(); }

        function addCustomValue() {
            let value = prompt("Entrez la valeur à ajouter au compteur :");
            if (value === null) return;
            value = Number(value);
            if (isNaN(value)) return alert("Veuillez entrer un nombre valide !");
            count += value;
            if (count < 0) count = 0;
            update();
        }

        /* ------------ Sauvegarde projet ------------- */

        function saveProject() {
            const name = prompt("Nom du projet :", currentProject || "");
            if (!name) return;

            currentProject = name;
            projectNameDisplay.textContent = "Projet en cours : " + currentProject;

            const projects = JSON.parse(localStorage.getItem("crochetProjects") || "[]");

            const updated = projects.filter(p => p.name !== name);
            updated.push({ name, value: count, date: new Date().toLocaleString() });

            localStorage.setItem("crochetProjects", JSON.stringify(updated));

            fillProjectMenu();

            alert("Projet sauvegardé !");
        }

        /* ------------ Chargement projet ------------- */

        function fillProjectMenu() {
            const projects = JSON.parse(localStorage.getItem("crochetProjects") || "[]");

            projectSelect.innerHTML = `<option value="">-- Sélectionnez un projet --</option>`;

            for (const p of projects) {
                const opt = document.createElement("option");
                opt.value = p.name;
                opt.textContent = p.name + " (" + p.value + ")";
                projectSelect.appendChild(opt);
            }
        }

        function loadSelectedProject() {
            const name = projectSelect.value;
            if (!name) return alert("Veuillez sélectionner un projet.");

            const projects = JSON.parse(localStorage.getItem("crochetProjects") || "[]");
            const proj = projects.find(p => p.name === name);

            if (!proj) return alert("Projet introuvable !");

            count = proj.value;
            currentProject = proj.name;
            projectNameDisplay.textContent = "Projet en cours : " + currentProject;

            update();
            alert("Projet chargé !");
        }

        /* ------------ Suppression projet ------------- */

        function deleteProject() {
            const name = projectSelect.value;
            if (!name) return alert("Veuillez sélectionner un projet à supprimer.");

            if (!confirm("Voulez-vous vraiment supprimer le projet \"" + name + "\" ?")) return;

            let projects = JSON.parse(localStorage.getItem("crochetProjects") || "[]");
            projects = projects.filter(p => p.name !== name);

            localStorage.setItem("crochetProjects", JSON.stringify(projects));

            fillProjectMenu();

            if (currentProject === name) {
                currentProject = null;
                projectNameDisplay.textContent = "Aucun projet chargé";
            }

            alert("Projet supprimé !");
        }

        /* ------------ Restauration auto ------------- */

        window.onload = () => {
            const saved = localStorage.getItem("compteurCrochet");
            if (saved !== null) count = Number(saved);

            fillProjectMenu();
            update();
        };
    </script>

</body>
</html>
