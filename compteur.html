<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Compteur Crochet</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3efe9;
            text-align: center;
            padding: 40px;
            transition: background-color 0.4s;
        }

        @keyframes shake {
            0% { transform: translate(0, 0); }
            25% { transform: translate(5px, -5px); }
            50% { transform: translate(-5px, 5px); }
            75% { transform: translate(5px, 5px); }
            100% { transform: translate(0, 0); }
        }

        .shake {
            animation: shake 0.4s ease;
        }

        h1 { color: #a86d3b; }
        .counter {
            font-size: 80px;
            margin: 20px;
            color: #4e342e;
            transition: 0.2s;
        }

        .last-update {
            font-size: 12px;
            color: #555;
            margin-top: -10px;
            margin-bottom: 20px;
        }

        button {
            font-size: 20px;
            padding: 15px 25px;
            margin: 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        .add { background: #8bc34a; }
        .minus { background: #e57373; }
        .reset { background: #bdbdbd; }
        .custom { background: #64b5f6; }

        .save { background: #ffb74d; }
        .load { background: #ce93d8; }
    </style>
</head>
<body>

    <h1>Compteur de Crochet 🧶</h1>

    <div class="counter" id="counter">0</div>
    <div class="last-update" id="lastUpdate">Dernière actualisation il y a 0 seconde</div>

    <button class="add" onclick="increment()">+1 rang</button>
    <button class="minus" onclick="decrement()">−1</button>
    <button class="custom" onclick="addCustomValue()">+ valeur précise</button>
    <button class="reset" onclick="resetCount()">Réinitialiser</button>

    <br><br>

    <!-- Nouveaux boutons -->
    <button class="save" onclick="saveProject()">💾 Sauvegarder</button>
    <button class="load" onclick="loadProject()">📂 Charger</button>

    <br><br>

    <a href="index.html" style="font-size:18px;">⬅ Retour</a>

    <audio id="ding">
        <source src="https://actions.google.com/sounds/v1/alarms/digital_watch_alarm.ogg" type="audio/ogg">
    </audio>

    <script>
        let count = 0;
        let lastUpdateTime = Date.now();

        const counterDisplay = document.getElementById("counter");
        const lastUpdateText = document.getElementById("lastUpdate");
        const ding = document.getElementById("ding");
        const body = document.body;

        /* ----------------------- MISE À JOUR ---------------------------- */

        function refreshLastUpdate() {
            let totalSeconds = Math.floor((Date.now() - lastUpdateTime) / 1000);
            let minutes = Math.floor(totalSeconds / 60);
            let seconds = totalSeconds % 60;

            let text = "Dernière actualisation il y a ";
            if (minutes > 0) text += minutes + " min ";
            text += seconds + " s";

            lastUpdateText.textContent = text;
        }

        setInterval(refreshLastUpdate, 1000);

        function update() {
            counterDisplay.textContent = (count % 100 === 69) ? count + " 😈" : count;

            lastUpdateTime = Date.now();
            refreshLastUpdate();

            localStorage.setItem("compteurCrochet", count);

            body.classList.remove("shake");

            if (count > 0 && count % 8 === 7) {
                ding.currentTime = 0;
                ding.play().catch(() => {});
                if (navigator.vibrate) navigator.vibrate([150, 50, 150]);

                body.classList.add("shake");
                body.style.backgroundColor = "#ffcdd2"; 
            } else {
                body.style.backgroundColor = "#f3efe9";
            }
        }

        /* ----------------------- BOUTONS COMPTEUR ---------------------------- */

        function increment() { count++; update(); }

        function decrement() { if (count > 0) count--; update(); }

        function resetCount() { count = 0; update(); }

        function addCustomValue() {
            let value = prompt("Entrez la valeur à ajouter au compteur :");
            if (value === null) return;

            value = Number(value);
            if (isNaN(value)) {
                alert("Veuillez entrer un nombre valide !");
                return;
            }

            count += value;
            if (count < 0) count = 0;
            update();
        }

        /* ----------------------- SAUVEGARDE PROJET ---------------------------- */

        function saveProject() {
            const name = prompt("Nom du projet :");
            if (!name) return;

            const projects = JSON.parse(localStorage.getItem("crochetProjects") || "[]");

            const existing = projects.find(p => p.name === name);
            if (existing && !confirm("Un projet porte déjà ce nom. Le remplacer ?")) return;

            const projectData = {
                name: name,
                value: count,
                date: new Date().toLocaleString()
            };

            const filtered = projects.filter(p => p.name !== name);
            filtered.push(projectData);

            localStorage.setItem("crochetProjects", JSON.stringify(filtered));

            alert("Projet sauvegardé !");
        }

        /* ----------------------- CHARGER PROJET ---------------------------- */

        function loadProject() {
            const projects = JSON.parse(localStorage.getItem("crochetProjects") || "[]");

            if (projects.length === 0) {
                alert("Aucun projet sauvegardé !");
                return;
            }

            const names = projects.map(p => p.name).join("\n");
            const chosen = prompt("Quel projet charger ?\n\n" + names);

            if (!chosen) return;

            const project = projects.find(p => p.name === chosen);

            if (!project) {
                alert("Projet introuvable !");
                return;
            }

            count = project.value;
            update();

            alert("Projet chargé : " + project.name);
        }

        /* ----------------------- RESTAURATION AUTO ---------------------------- */

        window.onload = () => {
            const saved = localStorage.getItem("compteurCrochet");
            if (saved !== null) count = Number(saved);
            update();
        };
    </script>

</body>
</html>
