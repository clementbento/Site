<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dessin en cubes</title>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #f3efe9, #e3d5c3);
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            width: 95%;
            max-width: 550px;
            animation: fadeIn 0.5s ease;
        }

        h1 {
            text-align: center;
            color: #7b4b27;
            margin-top: 0;
        }

        label {
            font-weight: 600;
            color: #5c4a3f;
        }

        input[type="number"],
        input[type="color"] {
            padding: 10px;
            font-size: 16px;
            border-radius: 10px;
            border: 1px solid #c9b8a6;
            margin: 5px;
        }

        input[type="number"] {
            width: 80px;
        }

        button {
            padding: 12px 20px;
            font-size: 17px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background: #d7b89c;
            color: white;
            margin: 10px auto;
            transition: 0.25s;
            font-weight: 600;
        }

        button:hover {
            background: #b89376;
            transform: translateY(-3px);
            box-shadow: 0 5px 12px rgba(0,0,0,0.15);
        }

        #canvasWrapper {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        #gridCanvas {
            border: 2px solid #c9b8a6;
            background: #ffffff;
        }

        a {
            display: block;
            margin-top: 20px;
            text-align: center;
            font-size: 16px;
            color: #6b5c50;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎨 Dessin en cubes</h1>

    <p style="text-align:center; color:#6b5c50;">
        Crée ta grille puis clique pour colorier les cases !
    </p>

    <div style="text-align:center;">
        <label>Colonnes :</label>
        <input type="number" id="cols" min="1" max="300" value="20">

        <label>Lignes :</label>
        <input type="number" id="rows" min="1" max="300" value="20">
    </div>

    <div style="text-align:center;">
        <button id="createBtn">Créer la grille</button>
        <button id="clearBtn">Tout effacer</button>
    </div>

    <div style="text-align:center; margin-top:20px;">
        <label>Couleur du stylo :</label>
        <input type="color" id="colorPicker" value="#000000">
    </div>

    <div id="canvasWrapper">
        <canvas id="gridCanvas" width="600" height="600"></canvas>
    </div>

    <a href="index.html">⬅ Retour à l'accueil</a>
</div>

<script>
    const canvas = document.getElementById("gridCanvas");
    const ctx = canvas.getContext("2d");

    const colsInput = document.getElementById("cols");
    const rowsInput = document.getElementById("rows");
    const colorPicker = document.getElementById("colorPicker");

    const createBtn = document.getElementById("createBtn");
    const clearBtn = document.getElementById("clearBtn");

    let cols = 20;
    let rows = 20;
    let grid = [];

    const CANVAS_SIZE = 600;

    // ───────────────────────────────────────────────
    //                SAUVEGARDE LOCALSTORAGE
    // ───────────────────────────────────────────────
    function saveState() {
        localStorage.setItem("gridData", JSON.stringify({
            cols,
            rows,
            grid
        }));
    }

    function loadState() {
        const data = localStorage.getItem("gridData");
        if (!data) return false;

        try {
            const parsed = JSON.parse(data);
            cols = parsed.cols;
            rows = parsed.rows;
            grid = parsed.grid;

            colsInput.value = cols;
            rowsInput.value = rows;

            return true;
        } catch (err) {
            console.error("Erreur chargement :", err);
            return false;
        }
    }

    // ─────────────────────────────────────────
    //               GESTION GRILLE
    // ─────────────────────────────────────────
    function createEmptyGrid(c, r) {
        return Array.from({ length: r }, () => Array(c).fill(null));
    }

    function draw() {
        const cellW = CANVAS_SIZE / cols;
        const cellH = CANVAS_SIZE / rows;

        ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

        // Couleurs
        for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
                if (grid[y][x]) {
                    ctx.fillStyle = grid[y][x];
                    ctx.fillRect(x * cellW, y * cellH, cellW, cellH);
                }
            }
        }

        // Quadrillage
        ctx.strokeStyle = "#d8c7b6";
        ctx.lineWidth = 1;

        for (let x = 0; x <= cols; x++) {
            ctx.beginPath();
            ctx.moveTo(x * cellW, 0);
            ctx.lineTo(x * cellW, CANVAS_SIZE);
            ctx.stroke();
        }

        for (let y = 0; y <= rows; y++) {
            ctx.beginPath();
            ctx.moveTo(0, y * cellH);
            ctx.lineTo(CANVAS_SIZE, y * cellH);
            ctx.stroke();
        }
    }

    canvas.addEventListener("click", (e) => {
        const rect = canvas.getBoundingClientRect();
        const cellW = CANVAS_SIZE / cols;
        const cellH = CANVAS_SIZE / rows;

        const x = Math.floor((e.clientX - rect.left) / cellW);
        const y = Math.floor((e.clientY - rect.top) / cellH);

        if (x >= 0 && x < cols && y >= 0 && y < rows) {
            grid[y][x] = colorPicker.value;
            saveState();
            draw();
        }
    });

    // ────────────────────────────────
    //             BOUTONS
    // ────────────────────────────────
    createBtn.addEventListener("click", () => {
        cols = parseInt(colsInput.value);
        rows = parseInt(rowsInput.value);

        grid = createEmptyGrid(cols, rows);
        saveState();
        draw();
    });

    clearBtn.addEventListener("click", () => {
        grid = createEmptyGrid(cols, rows);
        localStorage.removeItem("gridData");
        saveState();
        draw();
    });

    // ───────────────────────────────────────────────
    //             CHARGEMENT PAGE (restauration)
    // ───────────────────────────────────────────────
    if (!loadState()) {
        grid = createEmptyGrid(cols, rows);
    }
    draw();
</script>

</body>
</html>
