<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dessin en cubes</title>
    <style>
        #grid {
            display: grid;
            gap: 1px;
            margin-top: 20px;
        }
        .cell {
            width: 25px;
            height: 25px;
            background-color: white;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

<h1>Dessin en cubes</h1>

<label>Colonnes :</label>
<input type="number" id="cols" value="10">

<label>Lignes :</label>
<input type="number" id="rows" value="10">

<button onclick="createGrid()">Créer la grille</button>

<br><br>

<label>Couleur du stylo :</label>
<input type="color" id="colorPicker" value="#000000">

<div id="grid"></div>

<br>
<a href="index.html">Retour</a>

<script>
function createGrid() {
    const cols = parseInt(document.getElementById("cols").value);
    const rows = parseInt(document.getElementById("rows").value);
    const grid = document.getElementById("grid");

    grid.style.gridTemplateColumns = `repeat(${cols}, 25px)`;
    grid.innerHTML = "";

    for (let i = 0; i < cols * rows; i++) {
        const cell = document.createElement("div");
        cell.classList.add("cell");
        cell.addEventListener("click", () => {
            cell.style.backgroundColor = document.getElementById("colorPicker").value;
        });
        grid.appendChild(cell);
    }
}
</script>

</body>
</html>
