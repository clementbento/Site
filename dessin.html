<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dessin en cubes</title>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #f3efe9, #e3d5c3);
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            width: 95%;
            max-width: 550px;
            animation: fadeIn 0.5s ease;
        }

        h1 {
            text-align: center;
            color: #7b4b27;
            margin-top: 0;
        }

        label {
            font-weight: 600;
            color: #5c4a3f;
        }

        input[type="number"],
        input[type="color"] {
            padding: 10px;
            font-size: 16px;
            border-radius: 10px;
            border: 1px solid #c9b8a6;
            margin: 5px;
        }

        input[type="number"] {
            width: 80px;
        }

        button {
            padding: 12px 20px;
            font-size: 17px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background: #d7b89c;
            color: white;
            margin: 10px auto;
            transition: 0.25s;
            font-weight: 600;
        }

        button:hover {
            background: #b89376;
            transform: translateY(-3px);
            box-shadow: 0 5px 12px rgba(0,0,0,0.15);
        }

        #grid {
            display: grid;
            gap: 1px;
            margin-top: 20px;
            margin-left: auto;
            margin-right: auto;
            width: 300px;   /* largeur fixe */
            height: 300px;  /* hauteur fixe */
            border: 2px solid #c9b8a6;
            background: #eee3d7;
        }

        .cell {
            background-color: white;
            border: 1px solid #e1d3c4;
            transition: background 0.2s;
        }

        .cell:hover {
            border-color: #b89376;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        a {
            display: block;
            margin-top: 20px;
            text-align: center;
            font-size: 16px;
            color: #6b5c50;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

    </style>
</head>
<body>

<div class="container">
    <h1>🎨 Dessin en cubes</h1>

    <p style="text-align:center; color:#6b5c50;">
        Crée ta grille puis clique pour colorier les cases !
    </p>

    <div style="text-align:center; margin-bottom:10px;">
        <label>Colonnes :</label>
        <input type="number" id="cols" value="10" min="1">

        <label>Lignes :</label>
        <input type="number" id="rows" value="10" min="1">
    </div>

    <div style="text-align:center;">
        <button onclick="createGrid()">Créer la grille</button>
        <button onclick="clearGrid()">Tout effacer</button>
    </div>

    <div style="text-align:center; margin-top:20px;">
        <label>Couleur du stylo :</label>
        <input type="color" id="colorPicker" value="#000000">
    </div>

    <div id="grid"></div>

    <a href="index.html">⬅ Retour à l'accueil</a>
</div>

<script>
function createGrid() {
    const cols = parseInt(document.getElementById("cols").value);
    const rows = parseInt(document.getElementById("rows").value);
    const grid = document.getElementById("grid");

    // Taille totale fixe : 300px
    const totalSize = 300;
    const cellWidth = totalSize / cols;
    const cellHeight = totalSize / rows;

    grid.style.gridTemplateColumns = `repeat(${cols}, ${cellWidth}px)`;
    grid.style.gridTemplateRows = `repeat(${rows}, ${cellHeight}px)`;

    grid.innerHTML = "";

    for (let i = 0; i < cols * rows; i++) {
        const cell = document.createElement("div");
        cell.classList.add("cell");

        cell.style.width = cellWidth + "px";
        cell.style.height = cellHeight + "px";

        cell.addEventListener("click", () => {
            cell.style.backgroundColor = document.getElementById("colorPicker").value;
        });

        grid.appendChild(cell);
    }
}

// Efface toutes les cases sans changer la grille
function clearGrid() {
    document.querySelectorAll(".cell").forEach(cell => {
        cell.style.backgroundColor = "white";
    });
}
</script>

</body>
</html>
